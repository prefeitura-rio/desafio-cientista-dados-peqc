name: dbt CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      DBT_GCP_PROJECT: ${{ secrets.DBT_GCP_PROJECT }}
      DBT_BQ_DATASET: rmi_dbt_ci
      DBT_BQ_LOCATION: ${{ vars.DBT_BQ_LOCATION || 'southamerica-east1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps

      # Sempre roda: valida sintaxe Jinja/YAML, refs, contratos e seleção, sem credencial.
      - name: dbt parse (sem credenciais)
        run: dbt parse --no-partial-parse
        env:
          DBT_GCP_PROJECT: placeholder-project

      # Só roda quando o segredo do service account estiver configurado no repositório.
      - name: Autentica no GCP
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: dbt build
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: dbt build --fail-fast

      - name: Publica artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: target/
          if-no-files-found: ignore
