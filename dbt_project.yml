# ---------------------------------------------------------------------------
# Projeto dbt - Desafio RMI (Registro Municipal Integrado) - dados educacionais
# ---------------------------------------------------------------------------
name: "rmi_educacao"
version: "1.0.0"
config-version: 2

profile: "rmi_educacao"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Variáveis de negócio centralizadas: alterar aqui reflete em models e testes.
vars:
  ano_letivo: 2000                 # ano anonimizado nos dados (todas as datas foram levadas para 2000)
  limiar_frequencia_minima: 75.0   # LDB (Lei 9.394/96, art. 24): frequência mínima de 75% para aprovação
  nota_minima_aprovacao: 5.0       # média mínima adotada pela rede municipal do Rio

models:
  rmi_educacao:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

# Ordem de severidade dos testes: falhas de contrato quebram o build;
# anomalias conhecidas dos dados anonimizados geram apenas warn (ver schema.yml).
tests:
  rmi_educacao:
    +store_failures: true
    +schema: dbt_test_failures

on-run-end:
  - "{{ log('Run finalizado: ' ~ results | length ~ ' nodes executados', info=true) }}"
